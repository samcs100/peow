services:
  postgres:
    image: postgres:16-alpine
    container_name: peow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: peow
      POSTGRES_PASSWORD: peow
      POSTGRES_DB: peow
    ports:
      - "5432:5432"
    volumes:
      - peow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peow -d peow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  peow-pgdata:
    